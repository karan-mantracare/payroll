name: CI Pipeline

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Lint, Typecheck & Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Run Security & Permission Tests
        run: npm run test

      - name: Validate Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
