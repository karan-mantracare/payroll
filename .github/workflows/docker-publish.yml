name: Build and Push Docker Image to Harbor

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    name: Build & Push Container to bunker.mantracare.com
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor Registry (bunker.mantracare.com)
        uses: docker/login-action@v3
        with:
          registry: bunker.mantracare.com
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            bunker.mantracare.com/lovable/payrol:1.0
            bunker.mantracare.com/lovable/payrol:${{ github.sha }}
