name: Build and Push Docker Image to Harbor

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  migrate-staging-db:
    name: Apply Staging Schema Migrations (Turso)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Run Turso Staging Migrations
        env:
          PAYROLL_DB_ENV: staging
          TURSO_STAGING_DATABASE_URL: ${{ secrets.TURSO_STAGING_DATABASE_URL }}
          TURSO_STAGING_AUTH_TOKEN: ${{ secrets.TURSO_STAGING_AUTH_TOKEN }}
        run: |
          if [ -z "$TURSO_STAGING_DATABASE_URL" ] || [ -z "$TURSO_STAGING_AUTH_TOKEN" ]; then
            echo "Skipping Turso staging migrations: TURSO_STAGING_DATABASE_URL or TURSO_STAGING_AUTH_TOKEN secret not set."
            exit 0
          fi
          npm run db:migrate

  build-and-push:
    name: Build & Push Container to bunker.mantracare.com
    needs: migrate-staging-db
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor Registry (bunker.mantracare.com)
        uses: docker/login-action@v3
        with:
          registry: bunker.mantracare.com
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            bunker.mantracare.com/lovable/payrol:1.2
            bunker.mantracare.com/lovable/payrol:${{ github.sha }}
